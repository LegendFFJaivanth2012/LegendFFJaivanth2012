<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEROLINK</title>
<style>body{margin:0;background:#06101c;color:#eaf4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(560px,88vw);padding:28px;border:1px solid #234055;border-radius:20px;background:#0a1828}h1{letter-spacing:.16em;font-size:20px}p{color:#8ca3b8;line-height:1.6}.row{display:grid;gap:10px}button{padding:14px;border-radius:12px;border:1px solid #31546d;background:#10283d;color:#eaf4ff;font-weight:700}button.primary{background:#69e7ff;color:#03101b}.stat{margin-top:20px;padding:14px;background:#071522;border-radius:12px;font-family:monospace;font-size:12px;white-space:pre-wrap}</style></head>
<body><main><div>AEROLINK · ESP32 LOCAL UI</div><h1>AIR TRANSFER NODE</h1>
<p>This page is served directly by the ESP32 Wi-Fi network. The APK handles camera gesture detection; this page is the manual/debug interface.</p>
<div class="row"><button class="primary" onclick="status()">CHECK NODE</button><button onclick="location.href='/api/file'">DOWNLOAD RECEIVED FILE</button></div>
<div id="s" class="stat">Waiting…</div>
<script>async function status(){try{const r=await fetch('/api/status');document.querySelector('#s').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#s').textContent=e}}status();setInterval(status,1500)</script>
</main></body></html>
