name: AEROLINK iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -project aerolink-ios/AEROLINK.xcodeproj \
            -scheme AEROLINK \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AEROLINK.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package app
        run: |
          mkdir -p build/Payload
          cp -R build/AEROLINK.xcarchive/Products/Applications/AEROLINK.app build/Payload/
          cd build
          zip -r AEROLINK-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AEROLINK-unsigned-ipa
          path: build/AEROLINK-unsigned.ipa
